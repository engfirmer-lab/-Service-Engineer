name: Daily TRBL Backup to Google Drive

# รันทุกชั่วโมง แล้วให้ตัวสคริปต์เองเช็คการตั้งค่าจาก Firestore (เปิด/ปิด, เวลาที่ตั้งไว้, ทุกกี่วัน) ว่าถึงเวลาต้อง Backup จริงหรือยัง
# ถ้ายังไม่ถึงเวลา สคริปต์จะออกทันทีโดยไม่ทำอะไรเพิ่ม (ใช้โควต้า Firestore น้อยมาก แค่เช็คการตั้งค่า)
# กดรันมือเองก็ได้ผ่านแท็บ Actions บน GitHub (ปุ่ม "Run workflow") — การรันมือจะข้ามการเช็คตารางเวลาเสมอ บังคับ Backup ทันที
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install firebase-admin googleapis xlsx

      - name: Run backup script
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: node backup-script.js
